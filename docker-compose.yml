services:
  chatglm-panel:
    build: .
    image: chatglm-panel:latest
    container_name: chatglm-panel
    ports:
      - "8788:8788"
    environment:
      # 容器内监听所有网卡，端口与上方映射保持一致
      HOST: 0.0.0.0
      PORT: 8788
      PANEL_OPEN_BROWSER: "0"
    # 账号 / 配置 / 日志通过挂载加载：把宿主机目录挂到 /app/data
    # 首次启动会把默认配置写入挂载目录；放入 accounts.json 即加载账号。
    volumes:
      - ./data:/app/data
    restart: unless-stopped
